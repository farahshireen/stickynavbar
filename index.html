<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">
        <img src="./images/logo.png" alt="logo">
    </div>

    <ul class="menu">
        <li class="active">HOME</li>
        <li>ABOUT</li>
        <li>COFFEES</li>
        <li>SHOP</li>
        <li>BLOG</li>
        <li>CONTACT</li>
        <li>LOGIN</li>
    </ul>
</div>

<!-- Hero Section -->
<div class="hero">

    <div class="content">
        <h1>Coffee <br> Shop</h1>
        <p>more-or-less normal distribution of letters, as opposed to using</p>

        <button class="btn-red">ABOUT US</button>
        <button class="btn-white">CALL NOW</button>
    </div>

    

</div>
<div class="offer">
<h1>OUR COFFEE OFFER</h1>
</div>
<div class="containercard">
<figcaption class="card">
    <img src="./images/11.png" alt="coffee">
    <p>TYPES OF COFFEE</p>
</figcaption>
<figcaption class="card">
    <img src="./images/22.png" alt="coffee">
    <p>BEAN VARIETIES</p>
</figcaption>
<figcaption class="card">
    <img src="./images/33.png" alt="coffee">
    <p>COFFEE & PASTRY</p>
</figcaption>
<figcaption class="card">
    <img src="./images/44.png" alt="coffee">
    <p>COFFEE TO GO</p>
</figcaption>
</div>

</body>
</html>
